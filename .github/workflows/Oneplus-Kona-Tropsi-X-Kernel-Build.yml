name: Build Tropsi X Kernel (SM8250)

# Drop this file into .github/workflows/ of your NonGKI_Kernel_Build_2nd fork
# (TropsPk/NonGKI_Kernel_Build_2nd) — it relies on the shared composite actions
# (build-env, build-ready, patch-susfs, patch-no-kprobe, patch-baseband-guard,
# build-process, pack-process, upload-files) already living in that repo.

on:
  workflow_call:
  workflow_dispatch:

env:
  # --- Device ---
  DEVICE_NAME     : "oneplus_8"
  DEVICE_CODENAME : "instantnoodle"   # label only for zip naming; kona-perf_defconfig covers the whole 8-series/9R

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS  : "BRAND_SHOW_FLAG=oneplus LD=ld.lld LLVM=1 LLVM_IAS=1"

  # --- Kernel source ---
  KERNEL_SOURCE : "https://github.com/TropsPk/Tropsi_X_Kernel_SM8250.git"
  KERNEL_BRANCH : "OpKona"   # verified as the repo's current default branch — update if you cut a stable branch later

  # --- Toolchain ---
  CLANG_SOURCE : "https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.0/LLVM-20.1.0-Linux-X64.tar.xz"
  CLANG_BRANCH : ""
  # Swap to your Neutron Clang 19.0.0 build here if you'd rather keep that toolchain.

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  # --- Defconfig ---
  DEFCONFIG_NAME : "vendor/kona-perf_defconfig"   # confirmed present in the repo

  # --- KernelSU ---
  # Left blank on purpose (cleaner than cos15's explicit override): with
  # KERNELSU_AUTO_GET true + AUTO_FORK resukisu, build-ready pulls ReSukiSU
  # itself and appends CONFIG_KSU / CONFIG_KSU_MANUAL_HOOK automatically —
  # matches the ReSukiSU root solution your kernel already uses.
  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""
  KERNELSU_AUTO_GET  : "true"
  KERNELSU_AUTO_FORK : "resukisu"
  KERNELSU_METHOD    : "shell"

  # --- SUSFS ---
  SUSFS_ENABLE : false
  SUSFS_FIXED  : true

  PATCHES_SOURCE : "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH : "op_kernel"
  SUSFS_FOLDER_FIXED : "kona_cos15_a15"   # ⚠ verify this applies cleanly against YOUR tree — see note above
  SUSFS_PATCH_FIXED  : "susfs_fixed"

  HOOK_METHOD : "syscall"

  # --- AnyKernel3 ---
  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"
  PACK_METHOD  : "Anykernel3"
  PACK_KMODULES: "false"

  # --- Misc ---
  ROM_TEXT       : "TropsiXKernel"
  PYTHON_VERSION : "3"
  BASEBAND_GUARD_ENABLE : "true"
  BASEBAND_GUARD_BOOT   : "false"
  NEED_DTBO      : false
  NEED_SAFE_DTBO : false
  GENERATE_DTB   : "false"
  BUILD_DEBUGGER : "false"

jobs:
  build-kernel:
    name: Tropsi X Kernel — OnePlus 8 Series (SM8250)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: ❗ Remove stray dtb/dtbo
        run: |
          # kona-perf_defconfig is a shared multi-device tree; the loose top-level
          # dtb/dtbo.img it drops in out/arch/arm64/boot are generic build byproducts,
          # not scoped to this device — the real dtb is already inside Image.gz-dtb.
          # Packing the loose ones too risks conflicting with what's embedded.
          cd $GITHUB_WORKSPACE/device_kernel
          rm -f out/arch/arm64/boot/dtbo.img
          rm -f out/arch/arm64/boot/dtb
          echo "Removed stray dtbo.img and dtb."

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
